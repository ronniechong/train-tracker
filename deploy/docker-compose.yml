# "The stack": cd deploy && docker compose up -d
#
# Egress design (2a, confirmed 2026-07-20): `poller` is on the `internal`
# network ONLY. Compose marks that network `internal: true`, so Docker never
# gives it a default route to the outside world at all — this isn't a
# firewall rule that could be misconfigured, the network itself has no NAT.
# `poller` can reach `egress-proxy` (also on `internal`) and nothing else.
# `egress-proxy` additionally sits on `egress` (a normal bridge network with
# a route out) and further restricts *which* outside host it will forward
# to, via tinyproxy.filter — two independent layers, not one.
services:
  egress-proxy:
    image: docker.io/vimagick/tinyproxy:latest
    restart: unless-stopped
    read_only: true
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./tinyproxy.filter:/etc/tinyproxy/tinyproxy.filter:ro
    networks:
      - internal
      - egress

  poller:
    build:
      context: ../service
      dockerfile: Dockerfile
    # 2b landed the real poll loop (service-hours cadence + circuit
    # breaker with its own interval/backoff), so an unattended restart no
    # longer means "hammer the live API with no throttling" the way 2a's
    # one-shot smoke check did.
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      VIC_TRANSPORT_API_KEY: ${VIC_TRANSPORT_API_KEY:?VIC_TRANSPORT_API_KEY must be set in deploy/.env}
      # NOTE: wired through, but will currently fail from inside the
      # container — tinyproxy.filter allowlists ONLY the upstream gateway
      # host (security invariant #5). The dead-man ping's target host isn't
      # allowlisted yet; add it once the real TT_DEADMAN_PING_URL is known.
      # ping() fails soft (logs a warning, never raises), so this doesn't
      # crash the poller in the meantime.
      TT_DEADMAN_PING_URL: ${TT_DEADMAN_PING_URL:-}
      HTTP_PROXY: http://egress-proxy:8888
      HTTPS_PROXY: http://egress-proxy:8888
      NO_PROXY: ""
      # M3: `.env` only feeds compose-file `${...}` substitution, never a
      # container's process environment on its own -- this app.py reads it
      # via `os.environ`, so it has to be listed here explicitly too. Found
      # live (2026-07-30): every request was hitting the CORS "Disallowed
      # CORS origin" 400 path despite `.env` being set correctly, because
      # this line was missing since the FastAPI app first landed.
      TT_CORS_ORIGINS: ${TT_CORS_ORIGINS:-}
    volumes:
      - ${TT_DATA_DIR:-./data}:/data
      # 2e: nightly maintenance (`python -m traintracker.history`, run via
      # `docker compose run --rm --entrypoint "python -m traintracker.history"
      # poller`) reads/writes closed history partitions here. A second bind
      # mount, not a subdirectory of /data, so the backup copy is a genuinely
      # separate location on disk.
      - ${TT_BACKUP_DIR:-./backup}:/backup
    depends_on:
      - egress-proxy
    networks:
      - internal
      # 2f: joins the host's already-existing general monitoring stack's
      # network so ITS Prometheus can scrape `poller:9109` by service name --
      # no second Prometheus/Grafana/cAdvisor/node_exporter run by this repo
      # (see the `monitoring` network definition below and JOURNAL Session
      # 16/17). Purely additive: `poller` keeps its existing `internal`
      # egress-restricted network exactly as before, this only adds a second,
      # separate network for INBOUND scraping -- doesn't touch invariant #5.
      - monitoring
      # M3: a second, separate network carrying the FastAPI/SSE app's
      # inbound traffic only, shared with nothing but `caddy`. Distinct
      # from `internal` (which stays purely for the poller's own outbound
      # calls via `egress-proxy`) -- this container now has two independent
      # network purposes, not one network doing double duty.
      - ingress

  # M3: sole reverse-proxy ingress into the FastAPI/SSE app (invariant 4).
  # Joins `ingress` to reach `poller` and `public` for its own outbound
  # route -- the latter exists only because the `tailscale` sidecar below
  # shares this container's network namespace and needs it, not because
  # Caddy itself calls out anywhere.
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ingress
      - public
    depends_on:
      - poller

  # M3: terminates the public reverse-tunnel connection into Caddy. Shares
  # Caddy's network namespace (`network_mode`) instead of joining a network
  # of its own, so it reaches Caddy over localhost and never gains any
  # network membership beyond exactly what Caddy already has.
  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    network_mode: service:caddy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-entrypoint.sh:/entrypoint.sh:ro
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set in deploy/.env}
      TS_HOSTNAME: ${TS_HOSTNAME:-train-tracker}
      TARGET_PORT: "8080"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - caddy

networks:
  internal:
    internal: true
  egress:
    driver: bridge
  # M3: internal-only (no NAT out) -- `poller` only ever accepts inbound
  # from `caddy` here, never initiates anything on it.
  ingress:
    internal: true
  # M3: the only network with a real outbound route among the ones this
  # milestone adds. Exists for the `tailscale` sidecar's own traffic
  # (reaching the coordination service), inherited via `network_mode` on
  # the `caddy` service it shares a namespace with.
  public:
    driver: bridge
  # Not managed by this repo -- an already-running stack on the host owns
  # this network's actual definition (Grafana/Prometheus/Loki/cAdvisor/
  # node_exporter/Mongo, in a separate `docker compose` project). Referenced
  # here only so `poller` can join it; `external: true` means Compose must
  # find it already created, never tries to create or own it itself. If the
  # other stack's compose project directory or name ever changes, this
  # network name (Compose's default naming: `<project-dir-name>_default`)
  # would need updating to match -- host-specific enough that the exact
  # value is confirmed against the live host, not assumed.
  monitoring:
    external: true
    name: monitoring_default

volumes:
  caddy_data:
  caddy_config:
  tailscale_state:
