# "The stack": cd deploy && docker compose up -d
#
# Egress design: `poller` is on the `internal` network ONLY. Compose marks
# that network `internal: true`, so Docker never gives it a default route to
# the outside world — the network itself has no NAT, not just a firewall
# rule that could be misconfigured. `poller` can reach `egress-proxy` (also
# on `internal`) and nothing else. `egress-proxy` additionally sits on
# `egress` (a normal bridge network with a route out) and further restricts
# *which* outside host it will forward to, via tinyproxy.filter — two
# independent layers, not one.
#
# Pinned to avoid collision with another project's identically-named
# deploy/ directory (both default to project "deploy" otherwise).
name: train-tracker
services:
  egress-proxy:
    # Pinned by digest (image only ships a `latest` tag) so an upstream
    # push can't silently change what's running.
    image: docker.io/vimagick/tinyproxy:latest@sha256:72b441b95ee1e641af948f68f09492f9f795ead72b73954414e339168c98ad8c
    restart: unless-stopped
    read_only: true
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./tinyproxy.filter:/etc/tinyproxy/tinyproxy.filter:ro
    networks:
      - internal
      - egress

  poller:
    build:
      context: ../service
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      VIC_TRANSPORT_API_KEY: ${VIC_TRANSPORT_API_KEY:?VIC_TRANSPORT_API_KEY must be set in deploy/.env}
      # NOTE: wired through, but will currently fail from inside the
      # container — tinyproxy.filter allowlists ONLY the upstream gateway
      # host. The dead-man ping's target host isn't allowlisted yet; add it
      # once the real TT_DEADMAN_PING_URL is known. ping() fails soft (logs
      # a warning, never raises), so this doesn't crash the poller.
      TT_DEADMAN_PING_URL: ${TT_DEADMAN_PING_URL:-}
      HTTP_PROXY: http://egress-proxy:8888
      HTTPS_PROXY: http://egress-proxy:8888
      # Loopback exempted so in-container health checks (and any future
      # in-process tooling) can reach localhost without punching a new
      # egress-allowlist hole.
      NO_PROXY: "localhost,127.0.0.1"
      # `.env` only feeds compose-file `${...}` substitution, never a
      # container's process environment on its own — app.py reads this via
      # `os.environ`, so it has to be listed here explicitly too.
      TT_CORS_ORIGINS: ${TT_CORS_ORIGINS:-}
      # Same class of gap as TT_CORS_ORIGINS above — all optional by design
      # (ai/llm_client.py and ai/tracing.py construct cleanly with these
      # unset; they only fail at actual call time, and that failure is
      # caught and logged, never left to crash the poller).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      # Briefings reuse TT_ALERT_WEBHOOK_URL (poller/slack.py) rather than a
      # dedicated webhook. Grafana also posts to this same webhook directly,
      # from its own container, not via this env var — this line is what
      # lets the poller's process reach it too.
      TT_ALERT_WEBHOOK_URL: ${TT_ALERT_WEBHOOK_URL:-}
      # App-level bearer token for POST /briefing/trigger, on top of the
      # existing tailnet-only network isolation — unset means the route
      # falls back to network-isolation-only, so this must be set before
      # relying on the extra layer being live.
      TT_BRIEFING_TOKEN: ${TT_BRIEFING_TOKEN:-}
      # One-off toggle to directly confirm what Caddy's trusted_proxies
      # config resolves as X-Forwarded-For per real request. Unset
      # (default) = no-op; set to "1" temporarily, verify, then unset again.
      TT_DEBUG_CLIENT_IP: ${TT_DEBUG_CLIENT_IP:-}
      # Flagsmith server-side flag checks (feature-toggle system, decouples
      # feature work from milestone gating). Unset = every flags.is_enabled()
      # call falls back to its explicit default, never silently "on".
      FLAGSMITH_SERVER_ENV_KEY: ${FLAGSMITH_SERVER_ENV_KEY:-}
    volumes:
      - ${TT_DATA_DIR:-./data}:/data
      # Nightly maintenance (`python -m traintracker.history`, run via
      # `docker compose run --rm --entrypoint "python -m traintracker.history"
      # poller`) reads/writes closed history partitions here. A second bind
      # mount, not a subdirectory of /data, so the backup copy is a genuinely
      # separate location on disk.
      - ${TT_BACKUP_DIR:-./backup}:/backup
      # Same host directory the `archiver` service below writes to, mounted
      # here READ-ONLY so GET /archive/status can read its
      # `public_status.json` -- the one public-safe fact from the archive
      # pipeline (archive/public_status.py explains why only that one file
      # is meant to be read from here). `poller` never writes to this path;
      # the archiver container remains the sole writer.
      - ${TT_ARCHIVE_STATE_DIR:-./archive-state}:/archive-state:ro
    depends_on:
      - egress-proxy
    networks:
      - internal
      # Joins the host's already-existing general monitoring stack's
      # network so ITS Prometheus can scrape `poller:9109` by service name —
      # no second Prometheus/Grafana/cAdvisor/node_exporter run by this repo
      # (see the `monitoring` network definition below). Purely additive:
      # `poller` keeps its existing `internal` egress-restricted network
      # exactly as before, this only adds a second, separate network for
      # inbound scraping.
      - monitoring
      # A second, separate network carrying the FastAPI/SSE app's inbound
      # traffic only, shared with nothing but `caddy`. Distinct from
      # `internal` (which stays purely for the poller's own outbound calls
      # via `egress-proxy`) — this container has two independent network
      # purposes, not one network doing double duty.
      - ingress

  # The Hugging Face archive pipeline. A dedicated service, NOT a
  # `docker compose run --entrypoint ... poller` override like `history`'s
  # nightly job uses — `poller` needs /data writable for its own writes, but
  # the archiver must never write to data of record, so it needs its own
  # volume declarations with `:ro` where `poller`'s can't have them. Same
  # image/build context as `poller` though — one codebase, no second image
  # to build/maintain.
  #
  # No `restart:` policy — this is a one-shot job, not a long-running
  # daemon. Invoked by host cron (`docker compose run --rm archiver`) in the
  # same nightly slot as the existing backup/retention job, not an
  # independent schedule. Host cron wiring itself is a separate ops step.
  archiver:
    build:
      context: ../service
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "traintracker.archive"]
    read_only: true
    tmpfs:
      - /tmp
      # Disposable Parquet staging: every staged file is re-derivable from
      # the SQLite partition at any time, so it deliberately does NOT
      # survive a container restart or an unplanned host reboot. An
      # interrupted run just leaves that day "not yet fully archived" — the
      # next scheduled run's catch-up diff (upload.py's `archived_days` vs
      # local closed days) picks up exactly where it left off, per table,
      # with no special recovery needed.
      - /staging
    environment:
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN must be set in deploy/.env}
      HF_DATASET_REPO: ${HF_DATASET_REPO:?HF_DATASET_REPO must be set in deploy/.env}
      # Own dedicated healthchecks.io check, deliberately separate from
      # the poller's TT_DEADMAN_PING_URL above — same `hc-ping.com` host
      # (already allowlisted), different check ID, so a missed nightly
      # archiver run and a genuine poller outage don't look identical.
      # Optional like the poller's own — ping() fails soft if unset.
      TT_ARCHIVE_DEADMAN_PING_URL: ${TT_ARCHIVE_DEADMAN_PING_URL:-}
      # huggingface_hub's Xet upload backend writes a local cache; the
      # image's default $HOME (/app) sits on the read-only root FS, so
      # without this it fails every upload with "Read-only file system".
      # Point it at the /tmp tmpfs mount instead.
      HOME: /tmp
      # Same shared egress-proxy every other SaaS integration in this
      # project uses (Anthropic, Langfuse, Slack, Flagsmith), not a second
      # dedicated proxy. tinyproxy.filter allowlists huggingface.co AND
      # cas-server.xethub.hf.co (Xet storage backend) — a single-hostname
      # filter would have silently broken real uploads.
      HTTP_PROXY: http://egress-proxy:8888
      HTTPS_PROXY: http://egress-proxy:8888
      NO_PROXY: "localhost,127.0.0.1"
    volumes:
      # Read-only: the archiver never writes to data of record, unlike
      # `poller`'s own /data mount above, which must stay writable for its
      # own writes.
      - ${TT_DATA_DIR:-./data}:/data:ro
      - ${TT_BACKUP_DIR:-./backup}:/backup:ro
      # The small local state this container needs to persist across runs:
      # the gap/failure report (report.py, pruned to ~6 months) and a
      # node_exporter textfile-collector metrics file (metrics.py, under
      # metrics/) — the shared host's node-exporter is configured
      # (ops-side, outside this repo) to watch this same host path for
      # the .prom file. Deliberately separate from /data (read-only) and /staging
      # (ephemeral) — neither could hold it.
      - ${TT_ARCHIVE_STATE_DIR:-./archive-state}:/archive-state
    depends_on:
      - egress-proxy
    networks:
      - internal

  # M5's delay/ETA model retrain job. A third dedicated one-shot service,
  # same reasoning as `archiver` above: neither `poller` nor `archiver`'s
  # existing volume declarations fit this job. It needs BOTH `/data`
  # writable (writes the trained model to /data/ai/delay_model.json, which
  # `poller` reads at its own next startup) AND `/archive-state` writable
  # (writes its node_exporter textfile-collector metrics file next to
  # `archiver`'s own, the only host path node-exporter is configured to
  # watch) — `poller` has the former but not the latter, `archiver` has
  # the reverse. No network access needed (reads local SQLite history,
  # writes local files only, no egress) — still joins `internal` rather
  # than an unscoped default network, matching this stack's default-deny
  # posture.
  delay-model-trainer:
    build:
      context: ../service
      dockerfile: Dockerfile
    entrypoint: ["python", "scripts/train_delay_model.py", "--history-dir", "/data/history"]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${TT_DATA_DIR:-./data}:/data
      - ${TT_ARCHIVE_STATE_DIR:-./archive-state}:/archive-state
    networks:
      - internal

  # Sole reverse-proxy ingress into the FastAPI/SSE app. Joins `ingress` to
  # reach `poller` and `public` for its own outbound route — the latter
  # exists only because the `tailscale` sidecar below shares this
  # container's network namespace and needs it, not because Caddy itself
  # calls out anywhere.
  caddy:
    # Pinned by digest on top of the version tag.
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    read_only: true
    # Non-root, same UID convention as `poller`. Unlike `tailscale`, Caddy
    # needs no special capability: it only listens on the unprivileged
    # `:8080` here, TLS termination happens upstream of this container
    # entirely. `caddy_data`/`caddy_config` must be chowned to this UID once
    # before first use under this user — the official image runs as root
    # by default, so both volumes were created root-owned before this
    # changed.
    user: "1000:1000"
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ingress
      - public
    depends_on:
      - poller

  # Terminates the public reverse-tunnel connection into Caddy. Shares
  # Caddy's network namespace (`network_mode`) instead of joining a network
  # of its own, so it reaches Caddy over localhost and never gains any
  # network membership beyond exactly what Caddy already has.
  tailscale:
    # Pinned by digest (image only ships a `latest` tag) so an upstream push
    # can't silently change what's running — this one runs root +
    # NET_ADMIN/NET_RAW on the host, the highest-risk image in the stack.
    image: tailscale/tailscale:latest@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    restart: unless-stopped
    network_mode: service:caddy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-entrypoint.sh:/entrypoint.sh:ro
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set in deploy/.env}
      TS_HOSTNAME: ${TS_HOSTNAME:-train-tracker}
      TARGET_PORT: "8080"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - caddy

networks:
  internal:
    internal: true
  egress:
    driver: bridge
  # Internal-only (no NAT out) — `poller` only ever accepts inbound from
  # `caddy` here, never initiates anything on it.
  ingress:
    internal: true
  # The only network with a real outbound route among the ones this repo
  # adds. Exists for the `tailscale` sidecar's own traffic (reaching the
  # coordination service), inherited via `network_mode` on the `caddy`
  # service it shares a namespace with.
  public:
    driver: bridge
  # Not managed by this repo — an already-running stack on the host owns
  # this network's actual definition (Grafana/Prometheus/Loki/cAdvisor/
  # node_exporter/Mongo, in a separate `docker compose` project). Referenced
  # here only so `poller` can join it; `external: true` means Compose must
  # find it already created, never tries to create or own it itself. If the
  # other stack's compose project directory or name ever changes, this
  # network name (Compose's default naming: `<project-dir-name>_default`)
  # would need updating to match — host-specific enough that the exact
  # value is confirmed against the live host, not assumed.
  #
  # Explicitly accepted as a trusted network, not closed by splitting
  # /metrics onto a dedicated exporter. `poller`'s FastAPI port is
  # technically reachable from anything else joined to `monitoring`,
  # bypassing Caddy — but everything on this network is this same host's
  # own single-operator monitoring stack (no untrusted tenants, no other
  # party's containers), so the residual exposure is host-compromise-
  # equivalent, not a real additional attack surface. `/metrics` itself
  # carries no secrets. Revisit only if this host ever runs containers for
  # an untrusted party.
  monitoring:
    external: true
    name: monitoring_default

volumes:
  caddy_data:
  caddy_config:
  tailscale_state:
