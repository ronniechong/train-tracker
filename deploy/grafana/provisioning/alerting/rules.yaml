# Reference/template for the shared Grafana instance's provisioning, not
# something applied by file-provisioning directly (see contact-points.yaml's
# header for why -- the host runs a shared Grafana/Prometheus, not a
# dedicated instance for this project). **The first three rules below
# (feed-staleness, poller-down, disk-headroom) were confirmed LIVE in the
# shared instance** -- applied via the
# provisioning API with the instance's real datasource/folder UIDs
# substituted for the placeholder values below, not by pointing Grafana's
# file-provisioner at this file as-is. `rate-limit-abuse` (added 2026-07-30)
# follows the same pattern: written here with placeholders, applied live
# separately. Keep this file as the readable source of truth for what
# SHOULD exist; confirm against the live instance before assuming it does.
# Additional caveats beyond contact-points.yaml's:
#
# - `up{job="train-tracker-poller"}` and the `mountpoint="/"` disk query
#   below assume the shared Prometheus's scrape job is named exactly that
#   (see prometheus.yml's own note) and that there's exactly one
#   node_exporter target (true for a single-host setup, but review if that
#   changes). `folder: train-tracker` similarly assumes a fresh folder is
#   fine to create in the shared instance, not colliding with anything.
# - Every rule below carries a `project: train-tracker` label specifically
#   so a future *nested* notification policy (matching on that label) can
#   route these without touching the shared instance's existing root policy
#   -- see contact-points.yaml's point 2.
#
# 2f's three alert conditions (milestone AC), each a single Prometheus
# instant-query + classic threshold condition. Two suppression cases from
# the AC are handled as follows -- neither needed new mechanism to be built:
#   1. Backoff reason code: the staleness rule's own PromQL ANDs against
#      `traintracker_backoff_active == 0`, so a legitimate circuit-breaker
#      backoff episode never fires it.
#   2. Zero-entity-but-header-advancing: satisfied by construction --
#      staleness is header-timestamp age, never entity count, from the
#      metric's own definition (`metrics.py`). There was never an
#      entity-count-based signal here to produce a false positive from.
#
# The overall provisioned-alert-rule schema is one of Grafana's more
# version-sensitive areas -- confirmed working against the live instance's
# actual pinned version (13.0.2) for the first three rules; `rate-limit-
# abuse` uses the identical schema shape so is expected to load the same
# way, but confirm it actually evaluates once `traintracker_rate_limited_
# requests_total` has real samples (the metric doesn't exist in Prometheus
# until the rate limiter rejects at least one request).
apiVersion: 1

groups:
  - orgId: 1
    name: train-tracker-alerts
    folder: train-tracker
    interval: 1m
    rules:
      - uid: feed-staleness
        title: "Feed header stale (and not a backoff episode)"
        condition: C
        for: 2m
        labels:
          severity: critical
          project: train-tracker
        annotations:
          summary: "A realtime feed's header timestamp hasn't advanced in over 5 minutes, and the circuit breaker isn't backing off -- this is a real staleness/outage signal, not a polite pause."
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "(time() - traintracker_feed_last_changed_timestamp_seconds{feed=~\"trip_updates|vehicle_positions\"} > 300) and (traintracker_backoff_active == 0)"
              instant: true
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
            relativeTimeRange:
              from: 0
              to: 0

      - uid: poller-down
        title: "poller container down"
        condition: C
        for: 2m
        labels:
          severity: critical
          project: train-tracker
        annotations:
          summary: "Prometheus can no longer scrape the poller container at all."
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "up{job=\"train-tracker-poller\"} == 0"
              instant: true
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
            relativeTimeRange:
              from: 0
              to: 0

      - uid: rate-limit-abuse
        title: "High rate of rejected requests (possible DDoS/abuse)"
        condition: C
        for: 2m
        labels:
          severity: warning
          project: train-tracker
        annotations:
          summary: "The REST rate limiter (M3) has rejected more than 50 requests in the last 5 minutes, across either the per-IP or global cap -- legitimate traffic should essentially never hit this, so a sustained rise is an abuse/DDoS signal, not normal usage. First-cut threshold, not tuned against real post-launch traffic yet."
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # `or vector(0)` matters here specifically: unlike the other
              # rules' metrics (set every poll cycle from process start),
              # this Counter's labelled child doesn't exist in Prometheus
              # at all until the rate limiter rejects its first request --
              # without the fallback, `sum(increase(...))` over an absent
              # series returns no data, which Grafana would otherwise
              # evaluate as NoData rather than "0, all clear".
              expr: "sum(increase(traintracker_rate_limited_requests_total[5m])) or vector(0)"
              instant: true
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
              refId: C
            relativeTimeRange:
              from: 0
              to: 0

      - uid: http-5xx-rate
        title: "Sustained HTTP 5xx error rate"
        condition: C
        for: 2m
        labels:
          severity: warning
          project: train-tracker
        annotations:
          summary: "More than 10 5xx responses across all API routes in the last 5 minutes (M3, reopened 2026-08-01 -- traintracker_http_requests_total, see http_metrics.py) -- every route already returns a scrubbed generic error body on failure (finding #8), so a sustained rise here means something is genuinely broken server-side, not just a noisy client. First-cut threshold, not tuned against real post-launch traffic yet."
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              # Same `or vector(0)` reasoning as rate-limit-abuse above --
              # the {status=~"5.."} label combination doesn't exist in
              # Prometheus at all until the first 5xx actually happens.
              expr: "sum(increase(traintracker_http_requests_total{status=~\"5..\"}[5m])) or vector(0)"
              instant: true
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C
            relativeTimeRange:
              from: 0
              to: 0

      - uid: disk-headroom
        title: "Disk headroom below 15% free"
        condition: C
        for: 5m
        labels:
          severity: warning
          project: train-tracker
        annotations:
          summary: "Root filesystem free space has dropped below the confirmed 15% threshold (2026-07-20 decision)."
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: "(node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}) * 100"
              instant: true
              refId: A
            relativeTimeRange:
              from: 300
              to: 0
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [15]
              refId: C
            relativeTimeRange:
              from: 0
              to: 0
