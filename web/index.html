<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melbourne Train Tracker — live map</title>
    <!-- Privacy-friendly, no-cookie pageview analytics (goatcounter.com free
         tier). Skips localhost/private-network requests by default, so dev
         traffic never pollutes real numbers -- no extra config needed. -->
    <script data-goatcounter="https://traintracker.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
