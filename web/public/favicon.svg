<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <path d="M5 26 C 11 26, 11 17, 16 17 S 21 6, 27 6" fill="none" stroke="#4fc3f7" stroke-width="2.5" stroke-linecap="round"/>
  <style>
    .logo-pulse {
      transform-origin: 16px 17px;
      animation: logo-pulse 1.6s ease-out infinite;
    }
    @keyframes logo-pulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(2.4); opacity: 0; }
    }
  </style>
  <circle class="logo-pulse" cx="16" cy="17" r="3" fill="#FFBE00"/>
  <circle cx="16" cy="17" r="3" fill="#FFBE00" stroke="#1a1a1a" stroke-width="1.2"/>
</svg>
