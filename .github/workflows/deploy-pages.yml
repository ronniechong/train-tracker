name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy in flight at a time -- a second push mid-deploy
# should replace the in-progress one, not queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # Not a secret -- this URL ships in the built client bundle
          # regardless (any visitor's browser calls it directly), so it's
          # a repository VARIABLE, not a masked secret; masking it here
          # would be false security theater. Set once via:
          #   gh variable set VITE_API_BASE_URL --body "<url>"
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Flagsmith client-side environment ID is also non-secret (ships
          # in the bundle) -- this is deliberately the PRODUCTION
          # environment's ID, distinct from whatever's in a contributor's
          # local web/.env.local (Development), so a flag can be off in
          # prod while still on for local feature-building. Set once via:
          #   gh variable set VITE_FLAGSMITH_ENV_ID --body "<production client id>"
          VITE_FLAGSMITH_ENV_ID: ${{ vars.VITE_FLAGSMITH_ENV_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
