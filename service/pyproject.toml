[project]
name = "traintracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ronnie Chong", email = "ronniechong@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=2.1.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.21.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "anthropic>=0.120.2",
    "langfuse>=4.14.2",
    "flagsmith>=6.1.0",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
